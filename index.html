<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица products</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>Структура и данные таблицы: products</h1>
            <div id="connection-status" class="status-success">Загрузка данных...</div>
        </div>

        <div class="section">
            <h2>Список товаров</h2>
            <div class="table-container">
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название (name)</th>
                            <th>Цена (price)</th>
                            <th>Количество (quantity)</th>
                            <th>Итого (total)</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr>
                            <td colspan="5" class="empty-row">Загрузка...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
