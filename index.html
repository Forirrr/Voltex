<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление таблицей products</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем клиент Supabase через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Таблица продуктов</h1>
        
        <div class="section">
            <h2>Структура таблицы (information_schema)</h2>
            <div id="schema-loader" class="loader">Загрузка структуры...</div>
            <div class="table-container">
                <table id="schema-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Поле (Column)</th>
                            <th>Тип данных (Type)</th>
                            <th>По умолчанию (Default)</th>
                            <th>Null?</th>
                        </tr>
                    </thead>
                    <tbody id="schema-tbody"></tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <h2>Данные таблицы (products)</h2>
            <div id="data-loader" class="loader">Загрузка данных...</div>
            <div class="table-container">
                <table id="products-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Цена</th>
                            <th>Количество</th>
                            <th>Итого</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
